
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Comic Book Reader</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f2f3f5c4;
            color: #fff;
            text-align: center;
            transition: background 0.3s ease;
        }
        .reader-container {
            max-width: 900px;
            margin: 40px auto;
           
            padding: 20px;
            padding-top: 70px;
            background:  #e85c50;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            position: relative;
        }
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .toolbar button, .toolbar input {
            padding: 10px 15px;
            border: none;
            cursor: pointer;
            background: #68db03;
            color: white;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 25px;
            transition: background 0.3s ease;
        }
        .toolbar button:hover {
            background: #18e006;
        }
        .comic-viewer {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-radius: 10px;
        }
        .comic-viewer img {
            max-width: 100%;
            height: auto;
            transition: transform 0.3s ease;
            border-radius: 10px;
        }
        .dark-mode {
            background-color: #121212;
            color: #ccc;
        }
        .bookmark-list {
            margin-top: 50px;
            text-align: left;
            background: #0c0b0b;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }
        .bookmark-list h3 {
            margin-bottom: 10px;
        }
        .bookmark-list ul {
            list-style: none;
            padding: 0;
        }
        .bookmark-list li {
            background: #03a408;
            color: white;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        .bookmark-list li:hover {
            background: #4eb902;
        }
    </style>
</head>
<body>
    <div class="reader-container">
        <input type="file" id="fileInput" accept="image/*" multiple>
        <div class="toolbar">
            <button id="prevPage">Previous</button>
            <button id="nextPage">Next</button>
            <button id="zoomIn">Zoom In</button>
            <button id="zoomOut">Zoom Out</button>
            <button id="toggleMode">Light/Dark Mode</button>
            <button id="addBookmark">Add Bookmark</button>
            <!-- <input type="text" id="searchInput" placeholder="Search..."> -->
            <!-- <button id="searchButton">Search</button> -->
        </div>
        <div class="comic-viewer">
            <img id="comicImage" src="" alt="Comic Page">
        </div>
        <div class="bookmark-list">
            <h3>Bookmarks:</h3>
            <ul id="bookmarkList"></ul>
        </div>
    </div>
    <script>
        const fileInput = document.getElementById('fileInput');
        const comicImage = document.getElementById('comicImage');
        const prevPage = document.getElementById('prevPage');
        const nextPage = document.getElementById('nextPage');
        const zoomIn = document.getElementById('zoomIn');
        const zoomOut = document.getElementById('zoomOut');
        const toggleMode = document.getElementById('toggleMode');
        const addBookmark = document.getElementById('addBookmark');
        const bookmarkList = document.getElementById('bookmarkList');
        const searchInput = document.getElementById('searchInput');
        const searchButton = document.getElementById('searchButton');
        let images = [];
        let currentIndex = 0;
        let zoomLevel = 1;
        let bookmarks = [];
        
        fileInput.addEventListener('change', function(event) {
            images = Array.from(event.target.files).map(file => URL.createObjectURL(file));
            if (images.length > 0) {
                currentIndex = 0;
                comicImage.src = images[currentIndex];
            }
        });
        
        prevPage.addEventListener('click', function() {
            if (currentIndex > 0) {
                currentIndex--;
                comicImage.src = images[currentIndex];
            }
        });
        
        nextPage.addEventListener('click', function() {
            if (currentIndex < images.length - 1) {
                currentIndex++;
                comicImage.src = images[currentIndex];
            }
        });
        
        zoomIn.addEventListener('click', function() {
            zoomLevel += 0.2;
            comicImage.style.transform = `scale(${zoomLevel})`;
        });
        
        zoomOut.addEventListener('click', function() {
            if (zoomLevel > 0.5) {
                zoomLevel -= 0.2;
                comicImage.style.transform = `scale(${zoomLevel})`;
            }
        });
        
        toggleMode.addEventListener('click', function() {
            document.body.classList.toggle('dark-mode');
        });
        
        addBookmark.addEventListener('click', function() {
            if (!bookmarks.includes(currentIndex)) {
                bookmarks.push(currentIndex);
                let li = document.createElement('li');
                li.textContent = `Page ${currentIndex + 1}`;
                li.addEventListener('click', function() {
                    currentIndex = bookmarks[bookmarks.indexOf(currentIndex)];
                    comicImage.src = images[currentIndex];
                });
                bookmarkList.appendChild(li);
            }
        });
        
        searchButton.addEventListener('click', function() {
            let searchTerm = searchInput.value.toLowerCase();
            for (let i = 0; i < images.length; i++) {
                if (images[i].toLowerCase().includes(searchTerm)) {
                    currentIndex = i;
                    comicImage.src = images[currentIndex];
                    break;
                }
            }
        });
    </script>
</body>
</html>
